<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Splunk Logger Configuration</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; width: 340px; margin: 0; background-color: #f9f9f9; }
    h3 { margin-top: 0; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #555; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input:focus { border-color: #4CAF50; outline: none; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 11px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
    #testBtn { background-color: #008CBA; } /* Blue button */
    #testBtn:hover { background-color: #007B9E; }
    #saveBtn { background-color: #4CAF50; } /* Green button */
    #saveBtn:hover { background-color: #45a049; }
    #status { margin-top: 15px; font-size: 13px; text-align: center; font-weight: bold; min-height: 18px; line-height: 1.4; }
    footer { margin-top: 25px; text-align: center; font-size: 11px; color: #777; border-top: 1px dashed #ddd; padding-top: 10px; }
    footer a { color: #4CAF50; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Splunk Configuration</h3>
  
  <div class="field">
    <label for="hecUrl">Splunk HEC URL:</label>
    <input type="text" id="hecUrl" placeholder="https://example.com">
  </div>
  
  <div class="field">
    <label for="token">HEC Token:</label>
    <input type="password" id="token" placeholder="Enter HEC Token">
  </div>
  
  <div class="btn-group">
    <button id="testBtn" type="button">Test Connection</button>
    <button id="saveBtn" type="button">Save Configuration</button>
  </div>
  
  <div id="status"></div>

  <footer>
    Maintained by <a href="https://github.com" target="_blank">TokenSolution</a>
  </footer>

  <script src="options.js"></script>
</body>
</html>
